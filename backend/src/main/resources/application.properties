# H2 em memoria: o banco e recriado e populado pelo import.sql a cada subida.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:projetoia;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Modelo de linguagem: deepseek (API na nuvem), lmstudio (local) ou bedrock (AWS).
# Os dois primeiros falam a API da OpenAI.
app.llm.provider=deepseek
# A chave nao fica no repositorio: vem da variavel de ambiente DEEPSEEK_API_KEY, que em
# desenvolvimento pode ser definida no arquivo backend/.env (ignorado pelo git).
app.llm.deepseek.base-url=https://api.deepseek.com/v1
app.llm.deepseek.model=deepseek-flash
app.llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
# O modelo precisa ter suporte a tool calling; o id e o que aparece no LM Studio ou em GET /v1/models.
app.llm.lmstudio.base-url=http://localhost:1234/v1
app.llm.lmstudio.model=google/gemma-4-e2b
# Para o bedrock, defina tambem app.llm.bedrock.model-id; as credenciais vem da cadeia padrao da AWS.
app.llm.bedrock.region=us-east-1
